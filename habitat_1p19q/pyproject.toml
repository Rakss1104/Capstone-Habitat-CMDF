[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "habitat1p19q"
version = "3.0.0"
description = "Habitat imaging for 1p/19q codeletion in IDH-mutant gliomas (audited rebuild of Habitat_1p19q_IDHmut_v3.ipynb)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0", "pandas>=2.2", "scipy>=1.14", "scikit-learn>=1.6",
    "matplotlib>=3.9", "joblib>=1.4", "SimpleITK>=2.4",
]

[project.optional-dependencies]
imaging = ["pyradiomics", "PyWavelets>=1.6"]
dev = ["pytest>=8"]

[project.scripts]
habitat1p19q = "habitat1p19q.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end synthetic pipeline run"]
